<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediPortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="stylesheet" href="/styles.css?v=3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b3a4b'/%3E%3Cpath d='M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z' fill='%23f6f3ee'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>
  <script>
    if (window.caches && caches.keys) {
      caches.keys().then(function (claves) {
        claves.forEach(function (clave) { caches.delete(clave); });
      });
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (registros) {
        registros.forEach(function (registro) { registro.unregister(); });
      });
    }
  </script>
  <script src="/app.js?v=6"></script>
</body>
</html>
